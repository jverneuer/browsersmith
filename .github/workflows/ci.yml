name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: CI
    permissions:
      contents: write
      id-token: write
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint -- --deny-warnings
      - name: Enforce >=94% line coverage
      - run: npm test -- --coverage
      - name: Enforce >=94% line coverage
        run: |
          node -e "const MINIMUM=94;const fs=require('fs');let t;try{t=JSON.parse(fs.readFileSync('./coverage/coverage-summary.json','utf8')).total}catch(e){console.error('coverage-summary.json unreadable:',e.message);process.exit(1)}const p=t.lines.pct;if(p<MINIMUM){console.error('FAIL: line coverage '+p+'% < '+MINIMUM+'% minimum');process.exit(1)}console.log('OK: line coverage '+p+'% >= '+MINIMUM+'% minimum')"
      - name: Generate COVERAGE.md
        run: npx coverage-md
      - run: npm run build

      # Determine whether this push changed the package version vs. the previous
      # commit on main. Publish + tag/release are gated on this so a push that
      # only touches source/docs/CI never triggers an npm publish or a release.
      - name: Detect version or name change
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CUR_VER=$(node -p "require('./package.json').version")
          CUR_NAME=$(node -p "require('./package.json').name")
          PARENT=$(git rev-parse --short HEAD^ 2>/dev/null || echo "")
          if [ -z "$PARENT" ]; then
            CHANGED="true"
          else
            PREV_VER=$(git show "$PARENT:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")
            PREV_NAME=$(git show "$PARENT:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name" 2>/dev/null || echo "")
            if [ "$CUR_VER" != "$PREV_VER" ] || [ "$CUR_NAME" != "$PREV_NAME" ]; then
              CHANGED="true"
            else
              CHANGED="false"
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "$CUR_NAME@$CUR_VER (previous: ${PREV_NAME:-<none>}@${PREV_VER:-<none>}) — changed: $CHANGED"

      - name: Commit COVERAGE.md
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f COVERAGE.md coverage/badge.json
          if git diff --cached --quiet; then
            echo "coverage report unchanged — nothing to commit"
          else
            git commit -m "ci: update coverage report [skip ci]"
            git push origin HEAD:coverage --force-with-lease
          fi

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            exit 0
          fi
          npm publish --access public --provenance

      - name: Create git tag and GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — skipping release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
